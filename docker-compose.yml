version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zeit_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeit-network

  redis:
    image: redis:alpine
    container_name: zeit_redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - zeit-network

  backend:
    build:
      context: ./zeit-api
      dockerfile: Dockerfile
    container_name: zeit_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}

      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}      

      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}

      - API_BASE_URL=${API_BASE_URL}
      - APP_URL=${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - zeit-network

  frontend:
    build:
      context: ./zeit-frontend
      dockerfile: Dockerfile
    container_name: zeit_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - zeit-network

volumes:
  postgres_data:

networks:
  zeit-network:
    driver: bridge