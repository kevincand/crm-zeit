<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-8 border border-slate-700">
    <!-- Header/Logo -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white tracking-wider">ZEIT</h1>
      <p class="text-slate-400 text-sm mt-1">Gestão de Newsletter e Contatos</p>
    </div>

    <!-- Mensagem de Erro -->
    <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-lg">
      {{ errorMessage }}
    </div>

    <!-- Formulário -->
    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-300 mb-2">E-mail</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="admin@zeit.com.br"
          required
          class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-300 mb-2">Senha</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg hover:shadow-indigo-500/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span *ngIf="!isLoading">Entrar</span>
        <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
          <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Autenticando...
        </span>
      </button>
    </form>
  </div>
</div>
