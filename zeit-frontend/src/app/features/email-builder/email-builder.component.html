<div class="h-screen flex flex-col bg-slate-950 overflow-hidden">
  <!-- Topo da Tela do Construtor -->
  <header class="p-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between z-10">
    <div>
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <span class="material-symbols-outlined text-indigo-400">design_services</span> Construtor de E-mail
      </h2>
      <p class="text-xs text-slate-400">Arraste os blocos, altere cores, fontes e insira imagens</p>
    </div>

    <div class="flex items-center gap-3">

      <button
        (click)="exportAndUseHtml()"
        [disabled]="isSaving"
        class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-2"
      >
        <span class="material-symbols-outlined text-base">check_circle</span>
        {{ isSaving ? 'Exportando...' : 'Usar Este Layout na Campanha' }}
      </button>
    </div>
  </header>

  <!-- Container do Editor Visual -->
  <div class="flex-1 w-full relative">
    <email-editor
      #editor
      [options]="options"
      (loaded)="editorLoaded()"
      class="h-full w-full block"
    ></email-editor>
  </div>
</div>
